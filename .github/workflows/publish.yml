name: CI & Publish

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main]
    release:
        types: [published]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Typecheck
              run: bun run typecheck

            - name: Build
              run: bun run build

            - name: Test
              run: bun run test

    publish:
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'release'
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Build
              run: bun run build

            - name: Publish @roomkit/nestjs
              working-directory: packages/backend
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish @roomkit/react
              working-directory: packages/frontend
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
